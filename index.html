<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WHO???</title>
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <main class="hero">

    <div class="overlay"></div>
    <div class="text">

      <span>IT IS STILL WATCHING.</span>

    </div>
  </main>


  <script>

    const titles = [
        "WHO???",
        "WHERE ARE YOU?",
        "I CAN SEE YOU."
    ];

    let currentTitle = 0;

    function changeTitle()
    {
        let nextTitle;

        do
        {
            nextTitle = Math.floor(Math.random() * titles.length);
        } while (nextTitle === currentTitle);

        currentTitle = nextTitle;
        document.title = titles[currentTitle];

        const nextChange = Math.random() * 30000 + 20000;

        setTimeout(changeTitle, nextChange);
    }
    setTimeout(changeTitle, 10000);
</script>

</body>
</html>
